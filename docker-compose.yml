services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/lawyer_case_copilot.db
      UPLOAD_DIR: /data/uploads
      MODEL_PROVIDER: mock
    volumes:
      - lawyer_case_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  lawyer_case_data:

