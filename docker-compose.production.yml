services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lawyer_case_copilot
      POSTGRES_USER: lawyer_case
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawyer_case -d lawyer_case_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 20s
      timeout: 10s
      retries: 15

  backend:
    build: ./backend
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: production
      SEED_DEMO_DATA: "false"
      DATABASE_URL: postgresql+psycopg://lawyer_case:${POSTGRES_PASSWORD}@postgres:5432/lawyer_case_copilot
      AUTH_MODE: enabled
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-lawyer-case-files}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      ENCRYPT_UPLOADS: "true"
      WORKFLOW_EXECUTION_MODE: queue
      ALLOW_EXTERNAL_MODEL_FOR_CASE_FILES: "false"
      MALWARE_SCAN_PROVIDER: clamav
      MALWARE_SCAN_REQUIRED: "true"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:?set DATA_RETENTION_DAYS}
      REQUIRE_PERSONAL_EXPERIENCE_RULES: ${REQUIRE_PERSONAL_EXPERIENCE_RULES:-true}
      ENFORCE_PRODUCTION_READINESS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_healthy

  worker:
    build: ./backend
    command: python -m services.worker
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://lawyer_case:${POSTGRES_PASSWORD}@postgres:5432/lawyer_case_copilot
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-lawyer-case-files}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      WORKFLOW_EXECUTION_MODE: queue
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      ALLOW_EXTERNAL_MODEL_FOR_CASE_FILES: ${ALLOW_EXTERNAL_MODEL_FOR_CASE_FILES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  clamav_data:
